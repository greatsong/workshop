<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마무리 · 데이터로 시작하는 AI 수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  /* 워크샵 마무리 화면: → 키나 클릭으로 한 문장씩. 인트로 3D와 같은 색(아톰=골드, 비트=시안) */
  :root{ --bg:#0A0A0B; --ink:#F4F4F2; --dim:#A6A6A2; --faint:#5E5E60; --amber:#F3B03A; --cyan:#5AD6E6;
    --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:dark; }
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;cursor:pointer;}
  #bits{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 60% at 50% 50%,rgba(10,10,11,.86) 0%,rgba(10,10,11,.55) 60%,rgba(10,10,11,.15) 100%);}
  main{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(18px,3.4vh,34px);
    padding:0 max(20px,6vw);text-align:center;}
  .line{margin:0;max-width:62rem;font-weight:600;font-size:clamp(1.25rem,3vw,2.3rem);line-height:1.5;letter-spacing:-.01em;word-break:keep-all;text-wrap:balance;
    opacity:0;transform:translateY(18px);filter:blur(6px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.22,.61,.36,1),filter 1.1s ease;}
  .line.show{opacity:1;transform:none;filter:none;}
  .line .a{color:var(--amber);} .line .b{color:var(--cyan);}
  .line.thanks{margin-top:clamp(6px,2vh,20px);font-weight:700;font-size:clamp(2rem,5.6vw,4.2rem);letter-spacing:-.02em;}
  .hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:.8rem;color:var(--faint);transition:opacity .8s;}
  .hint kbd{font-family:var(--font-mono);font-size:.74rem;border:1px solid rgba(244,244,242,.16);border-radius:4px;padding:0 5px;color:var(--dim);}
  .hint.off{opacity:0;}
  @media (prefers-reduced-motion:reduce){ .line{transition:opacity .4s;transform:none;filter:none;} }
</style>
</head>
<body>
<canvas id="bits" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<main aria-live="polite">
  <p class="line"><span class="b">비트 세상</span>의 데이터는 아직 <span class="a">교실</span>까지 연결되지 못했습니다.</p>
  <p class="line">선생님들의 다양한 아이디어로 <span class="b">살아있는 데이터 수업</span>이 시작되길 바라고,</p>
  <p class="line">AI의 도움을 받아 기존에는 시도해보지 못했던 <span class="a">멋진 수업</span>을 해보시길 응원합니다!</p>
  <p class="line thanks">감사합니다! :)</p>
</main>
<p class="hint" id="hint"><kbd>→</kbd> 또는 클릭으로 한 문장씩 · <kbd>←</kbd> 되돌리기 · <kbd>F</kbd> 전체 화면</p>
<script>
(function(){
'use strict';
/* 한 문장씩 보이기 */
const lines=[...document.querySelectorAll('.line')], hint=document.getElementById('hint');
let shown=0;
function render(){ lines.forEach((l,i)=>l.classList.toggle('show',i<shown)); hint.classList.toggle('off',shown>0); glow=shown/lines.length; }
function next(){ if(shown<lines.length){ shown++; render(); } }
function prev(){ if(shown>0){ shown--; render(); } }
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='f'||e.key==='F'){ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(_){} }
});
addEventListener('click',next);

/* 배경: 은은하게 흐르는 0과 1. 문장이 늘수록 조금씩 밝아진다 */
const cv=document.getElementById('bits'), ctx=cv.getContext('2d');
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let W=0,H=0,DPR=1,cols=[],glow=0,g=0;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const step=26, n=Math.ceil(W/step)+1; cols=[];
  for(let i=0;i<n;i++) cols.push({x:i*step+((i*37)%11), y:Math.random()*H, sp:12+Math.random()*26, amber:Math.random()<.22, len:6+((Math.random()*10)|0),
    glyphs:Array.from({length:22},()=>Math.random()<.5?'0':'1')}); }
addEventListener('resize',resize); resize();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; g+=(glow-g)*Math.min(1,dt*1.5);
  ctx.clearRect(0,0,W,H); ctx.font='600 15px "IBM Plex Mono", ui-monospace, monospace'; ctx.textAlign='center';
  for(const c of cols){
    if(!reduce) c.y+=c.sp*dt; if(c.y-c.len*20>H) c.y=-20;
    for(let k=0;k<c.len;k++){
      const y=c.y-k*20; if(y<-20||y>H+20) continue;
      const a=(1-k/c.len)*(.18+.32*g);
      ctx.fillStyle=c.amber?`rgba(243,176,58,${a})`:`rgba(90,214,230,${a})`;
      ctx.fillText(c.glyphs[(k+((c.y/20)|0))%c.glyphs.length],c.x,y);
    }
    if(Math.random()<.02) c.glyphs[(Math.random()*c.glyphs.length)|0]=Math.random()<.5?'0':'1';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
render();
})();
</script>
</body>
</html>
